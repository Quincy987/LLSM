[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llsm"
version = "0.3.6"
description = "LLM-driven automation for SCIA Engineer"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pythonnet>=3.0.5,<3.1",
    "pywin32>=310",
    "psutil>=7.0.0",
    "mcp[cli]>=1.2,<2",
]

[project.optional-dependencies]
dev = ["watchdog>=4.0", "pytest>=7.4", "pytest-mock>=3.12"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=0.3"]
wizard = ["keyring>=25"]
all = ["openai>=1.50", "google-genai>=0.3", "keyring>=25"]

[project.scripts]
llsm = "llsm.cli:main"
llsm-panel = "llsm.panel:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llsm.scia" = ["resources/*.def"]
